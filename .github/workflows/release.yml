name: Release

# Tag X.Y.Z (or vX.Y.Z) pushes 4pdosc/switchboard:X.Y.Z, plus :latest unless
# the tag is a prerelease (contains "-"). The helm-charts switchboard chart
# points at this repository; its CI checks the tag exists before a chart bump
# can merge, so tag here first.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]*'

permissions: {}

env:
  IMAGE: 4pdosc/switchboard

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the tags to push
        id: tags
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=${version}"
            echo "tags<<T_EOF"
            echo "${IMAGE}:${version}"
            case "$version" in
              *-*) ;;
              *) echo "${IMAGE}:latest" ;;
            esac
            echo "T_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
