name: image-check

# Builds the image for each release platform and checks the binary inside is
# built for that platform (the Dockerfile cross-compiles on the build host, so
# a wrong GOARCH would otherwise only show at pod start).
on:
  pull_request:
    paths:
      - 'Dockerfile*'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/image-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and check the image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          arch=${PLATFORM#linux/}
          case "$arch" in
            amd64) want="X86-64" ;;
            arm64) want="AArch64" ;;
            *) echo "no ELF machine known for $arch" >&2; exit 1 ;;
          esac
          docker buildx build --platform "$PLATFORM" --load -t "check:$arch" .
          got=$(docker image inspect --format '{{.Architecture}}' "check:$arch")
          [ "$got" = "$arch" ] || { echo "::error::image architecture $got, want $arch"; exit 1; }
          id=$(docker create --platform "$PLATFORM" "check:$arch")
          docker cp "$id:/switchboard" ./bin.check
          docker rm "$id" >/dev/null
          machine=$(readelf -h ./bin.check | sed -n 's/^ *Machine: *//p')
          echo "/switchboard: $machine"
          case "$machine" in
            *"$want"*) ;;
            *) echo "::error::/switchboard is built for '$machine', the $PLATFORM image needs $want"; exit 1 ;;
          esac
